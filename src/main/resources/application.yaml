spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db0
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  application:
    name: demo

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB